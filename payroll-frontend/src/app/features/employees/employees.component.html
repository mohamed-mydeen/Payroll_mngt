<div class="page-container">
  <div class="page-header">
    <div>
      <h2>Employee Directory</h2>
      <p>Manage your organization's employees</p>
    </div>
    <button class="premium-btn" (click)="openAddEmployeeDialog()">+ Add Employee</button>
  </div>

  <div class="panel table-container">
    <table mat-table [dataSource]="dataSource" class="premium-table">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> 
          <div class="user-cell">
            <div class="avatar-sm">{{element.name.charAt(0)}}</div>
            {{element.name}}
          </div>
        </td>
      </ng-container>

      <!-- Role Column -->
      <ng-container matColumnDef="roleType">
        <th mat-header-cell *matHeaderCellDef> Work Model </th>
        <td mat-cell *matCellDef="let element"> 
          <span class="badge" [class]="element.roleType.toLowerCase()">{{element.roleType}}</span>
        </td>
      </ng-container>

      <!-- Salary Column -->
      <ng-container matColumnDef="salaryAmount">
        <th mat-header-cell *matHeaderCellDef> Salary </th>
        <td mat-cell *matCellDef="let element"> {{element.salaryAmount | currency}} / {{element.salaryType}} </td>
      </ng-container>

      <!-- Action Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element">
          <button class="icon-btn-sm" (click)="editEmployee(element)">Edit</button>
          <button class="icon-btn-sm danger" (click)="deleteEmployee(element)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
