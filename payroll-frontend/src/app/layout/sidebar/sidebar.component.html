<div class="app-layout">
  <aside class="sidebar panel">
    <div class="brand">
      <span class="icon">C</span>
      <h2>Correa</h2>
    </div>
    
    <nav class="nav-menu">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
        <span class="nav-icon"></span> Dashboard
      </a>
      <a routerLink="/employees" routerLinkActive="active" class="nav-link">
        <span class="nav-icon"></span> Employees
      </a>
      <a routerLink="/attendance" routerLinkActive="active" class="nav-link">
        <span class="nav-icon"></span> Attendance
      </a>
      <a routerLink="/leaves" routerLinkActive="active" class="nav-link">
        <span class="nav-icon"></span> Leaves
      </a>
      <a routerLink="/payroll" routerLinkActive="active" class="nav-link">
        <span class="nav-icon"></span> Payroll
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar">A</div>
        <div class="details">
          <span class="name">Admin User</span>
          <span class="role">Administrator</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-header panel">
      <div class="breadcrumb">
        <span>Dashboard</span>
      </div>
    </header>
    
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
