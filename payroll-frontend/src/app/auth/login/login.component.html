<div class="login-container">
  <div class="panel login-box">
    <div class="logo">
      <div class="icon">C</div>
      <h2>Correa</h2>
    </div>
    
    <p class="subtitle">Welcome back! Please login to your account.</p>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div *ngIf="errorMessage" style="color: var(--danger); margin-bottom: 15px; text-align: center; font-size: 14px;">
        {{ errorMessage }}
      </div>
      <div class="input-group">
        <label for="email">Work Email</label>
        <input type="email" id="email" formControlName="email" placeholder="Enter your email"
               [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)}">
        <div class="error-text" *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email address.</span>
        </div>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••"
               [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)}">
        <div class="error-text" *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
        </div>
      </div>
      


      <button type="submit" class="premium-btn w-100" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign In to Dashboard' }}
      </button>
      
    </form>
  </div>
</div>
